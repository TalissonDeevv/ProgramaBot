[pytest]
# Pasta onde ficam os testes.
testpaths = tests
# Permite "from bot..." nos testes sem instalar o projeto.
pythonpath = .
# Executa testes "async def" automaticamente (plugin pytest-asyncio).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Aviso interno do discord.py em Python 3.12 (não vem do nosso código).
    ignore:'audioop' is deprecated:DeprecationWarning
